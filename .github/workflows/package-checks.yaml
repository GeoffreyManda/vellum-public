name: Package installation, tests and worked example
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagick++-dev libavfilter-dev libharfbuzz-dev libfribidi-dev libfontconfig1-dev libfreetype6-dev libpng-dev libtiff-dev libjpeg-dev libxml2-dev libcurl4-openssl-dev libssl-dev libgit2-dev ffmpeg
      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          install.packages("remotes")
          remotes::install_deps(dependencies = NA, upgrade = "never")
          install.packages(c("testthat", "vdiffr", "svglite", "ragg", "jsonlite", "png", "knitr", "rmarkdown"))
      - name: Install package with tests
        run: R CMD INSTALL --install-tests .
      - name: Run installed tests
        shell: Rscript {0}
        run: |
          testthat::test_package("vellum", stop_on_failure = TRUE)
      - name: Run installed worked example
        shell: Rscript {0}
        run: |
          path <- system.file("examples", "worked-example.R", package = "vellum")
          stopifnot(nzchar(path))
          source(path)
